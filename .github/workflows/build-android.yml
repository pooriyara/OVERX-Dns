name: Build Android

on:
  push:
    branches: [ main, master, dev ]
    paths: [ 'android/**', 'shared/**', '.github/workflows/build-android.yml' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}

      - name: Sync shared UI
        run: |
          mkdir -p app/src/main/assets
          cp ../shared/ui/index.html app/src/main/assets/index.html
          cp ../shared/ui/icon.png app/src/main/assets/icon.png
          mkdir -p app/src/main/assets/themes
          cp -r ../shared/ui/themes/* app/src/main/assets/themes/ 2>/dev/null || cp ../shared/ui/themes/*.png app/src/main/assets/themes/ 2>/dev/null || true
          # handle nested themes/themes if previous bad copy created it
          if [ -d app/src/main/assets/themes/themes ]; then cp app/src/main/assets/themes/themes/*.png app/src/main/assets/themes/ 2>/dev/null || true; rm -rf app/src/main/assets/themes/themes; fi
          ls -lh app/src/main/assets/
          ls -lh app/src/main/assets/themes/ 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew || echo "gradlew missing, will generate"

      - name: Generate gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating gradle wrapper 8.7"
            gradle wrapper --gradle-version 8.7 || echo "gradle not found, trying wrapper download"
          fi
          ls -lh gradlew* 2>/dev/null || true
          ls -lh gradle/wrapper/ 2>/dev/null || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: OVERX-Dns-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: OVERX-Dns-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
